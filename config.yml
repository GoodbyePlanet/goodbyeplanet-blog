baseURL: ""
languageCode: en-us
defaultContentLanguage: en
title: GoodbyePlanet blog
theme: cupper-hugo-theme

params:
  footer: "**GoodbyePlanet blog** is created by [GoodbyePlanet](https://github.com/GoodbyePlanet). All rights to the **Mother Earth**."
  search: false
  # Post likes are stored in Supabase. The anon key is public by design and is
  # scoped by row level security: reads are allowed, writes only go through the
  # increment_likes() function. Leave these empty and the heart still renders,
  # it just keeps the like in the reader's browser without a shared count.
  likes:
    supabaseUrl: "https://vzudpehbcvvvtkaivndr.supabase.co"
    supabaseAnonKey: "sb_publishable_zFAfdsfikoEihlpFjnm1Ig_htl6Ehp1"

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    style: github
    lineNos: true
    noClasses: false
    codeFences: true

taxonomies:
  tag: tags
  author: authors

menu:
  nav:
    - name: Home
      url: /
      weight: 1
    - name: Blog
      url: /post/
      weight: 2
    - name: Tags
      url: /tags/
      weight: 3
    - name: RSS
      url: /index.xml
      weight: 4
